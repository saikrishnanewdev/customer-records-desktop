name: Build Windows .exe

# Runs on every push to main: builds the app on a real Windows machine
# and uploads CustomerRecords.exe as a downloadable artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: pyinstaller app.spec

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: CustomerRecords-windows
          path: dist/CustomerRecords.exe
